name: Refresh data and publish

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# contents: write to commit the snapshots; pages/id-token for the deploy job
# this workflow calls. A called workflow can only narrow the caller's token,
# never widen it, so the Pages permissions have to be granted here too.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest ISS TLE
        run: node scripts/fetch-iss-tle.mjs

      # Each source is independent: a bad response from one shouldn't hold
      # back the other's fresh data, so these run even if a previous step
      # failed. The job still reports failure at the end.
      - name: Fetch upcoming rocket launches
        if: always()
        run: node scripts/fetch-rocket-launches.mjs

      - name: Commit snapshots if changed
        id: commit
        if: always()
        run: |
          if git diff --quiet -- src/data; then
            echo "No data change, skipping commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data
          git commit -m "chore: refresh data snapshots"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Without this the snapshots sit in main unpublished: the bot's push can't
  # trigger the deploy workflow on its own.
  deploy:
    needs: refresh
    if: ${{ always() && needs.refresh.outputs.changed == 'true' }}
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.refresh.outputs.sha }}
    secrets: inherit
