name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Callable from the data-refresh workflow. A push made with the default
  # GITHUB_TOKEN does not trigger workflows (GitHub's recursion guard), so a
  # refresh commit can only reach Pages by calling this workflow directly.
  workflow_call:
    inputs:
      ref:
        description: Commit to build. Defaults to the commit that triggered the run.
        type: string
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # When called after a refresh commit, github.sha still points at the
          # commit the run started from — i.e. the data we just replaced — so
          # the caller passes the new commit explicitly.
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_LOCATIONIQ_API_KEY: ${{ secrets.VITE_LOCATIONIQ_API_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
