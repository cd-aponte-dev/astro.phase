name: Refresh rocket launches

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-rocket-launches
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch upcoming launches
        run: node scripts/fetch-rocket-launches.mjs

      - name: Commit snapshot if changed
        run: |
          if git diff --quiet -- src/data/rocket-launches.json; then
            echo "No launch data change, skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/rocket-launches.json
          git commit -m "chore: refresh rocket launch snapshot"
          git push
